<!doctype html>
<!--
  pick-dont-describe · comparison page template
  =============================================
  HOW TO FILL THIS IN (for Claude):
  1. Copy this file to .variants/<target-name>-variants.html in the user's project.
  2. Set the target name in two places: the <title> element and the data-target attribute on <body>.
  3. Find the marker line "VARIANTS: START" further down. Delete the two EXAMPLE variants there
     and add one template element with class "variant" per variant inside the round section. Attributes:
       data-n      label shown in the big badge: "1".."10" in round 1, "R2-1".."R2-4" in round 2
       data-name   2-4 word name, e.g. "Editorial serif"
       data-note   one line on what makes it different
       data-axes   optional, short axes summary, e.g. "split · dark · mono caps · neon · compact"
     The template's content is a self-contained snippet: <link> to Google Fonts if needed,
     a <style> block, and the markup. It is rendered inside its own iframe, so write plain,
     unprefixed CSS — nothing leaks between variants. Style `body` to set the canvas background.
     Avoid height:100vh on the outer element (frames auto-size to content).
  4. New round = a new section element with class "round", data-round="2" and
     data-title="Round 2 · Layout 4 × colors 7", placed AFTER the previous round's section. Keep old rounds: they become tabs, the latest opens by default.
  5. Optional: put the axes table in an HTML comment inside each round for your own reference.
  No build step, no dependencies. Opens with a double click.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TARGET_NAME__ · variants</title>
<style>
  :root {
    --bg: #eceef1; --panel: #ffffff; --ink: #14161a; --muted: #5d6470; --line: #d6dae0;
    --accent: #2b59ff; --accent-ink: #ffffff; --chip: #f2f4f7; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101215; --panel: #1a1d22; --ink: #eef0f3; --muted: #9aa3ae; --line: #2c3139;
      --accent: #7c9cff; --accent-ink: #0d1020; --chip: #232830; --shadow: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* header */
  .bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--panel) 92%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 1600px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
  .title { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
  .title strong { font-size: 16px; }
  .title span { color: var(--muted); font-size: 13px; }
  .title code { background: var(--chip); padding: 1px 6px; border-radius: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .tabs { max-width: 1600px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
  .tabs:empty { display: none; }
  .tabs button { border: 0; background: none; padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

  /* board */
  main { max-width: 1600px; margin: 0 auto; padding: 16px 16px 120px; }
  .board { display: grid; gap: 16px; align-items: start; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); }
  .board.list { grid-template-columns: 1fr; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
  .card-head { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-bottom: 1px solid var(--line); }
  .num { flex: none; min-width: 44px; height: 44px; padding: 0 8px; border-radius: 10px; background: var(--ink); color: var(--panel);
    display: grid; place-items: center; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .meta { flex: 1; min-width: 0; }
  .meta b { display: block; font-size: 15px; }
  .meta p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .meta small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; opacity: .85; }
  .tools { display: flex; gap: 6px; flex: none; }
  .icon { border: 1px solid var(--line); background: var(--chip); border-radius: 8px; height: 32px; min-width: 32px; padding: 0 8px; font-size: 12px; }
  .icon[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .stage { position: relative; overflow: hidden; background: repeating-conic-gradient(var(--chip) 0 25%, transparent 0 50%) 0 0/16px 16px; cursor: zoom-in; }
  .stage iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; pointer-events: none; }
  .stage.mobile iframe { box-shadow: 0 0 0 1px var(--line); }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: center; }
  .picks span { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .picks button { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .picks button:hover, .picks button:focus-visible { border-color: var(--accent); }

  /* pick bar */
  .pickbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 30; width: min(760px, calc(100% - 32px));
    display: none; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  .pickbar.on { display: flex; }
  .pickbar input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 8px; padding: 8px 10px; font: inherit; }
  .pickbar .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 600; }

  /* full view */
  .full { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: none; flex-direction: column; }
  .full.on { display: flex; }
  .full-head { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .full-head .meta b { font-size: 16px; }
  .full-body { flex: 1; overflow: auto; padding: 16px; }
  .full-body iframe { display: block; margin: 0 auto; border: 0; background: #fff; width: 100%; box-shadow: var(--shadow); }
  .full-body.mobile iframe { width: 375px; max-width: 100%; }
  .variants-src { display: none; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body data-target="__TARGET_NAME__">

<header class="bar">
  <div class="bar-inner">
    <div class="title">
      <strong id="target"></strong>
      <span>Pick, don't describe. Reply in chat with e.g. <code>layout from 4, colors from 7</code>, or use the pick buttons under each variant.</span>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="View">
        <button data-view="grid" aria-pressed="true">Grid</button>
        <button data-view="list" aria-pressed="false">List</button>
      </div>
      <div class="seg" role="group" aria-label="Width">
        <button data-width="desktop" aria-pressed="true">Desktop</button>
        <button data-width="mobile" aria-pressed="false">Mobile</button>
      </div>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Rounds"></nav>
</header>

<main>
  <div class="board" id="board"></div>
</main>

<div class="pickbar" id="pickbar">
  <input id="pickText" aria-label="Your picks" placeholder="Your picks">
  <button class="primary" id="copyPicks">Copy</button>
  <button class="icon" id="clearPicks" aria-label="Clear picks">Clear</button>
</div>

<div class="full" id="full" role="dialog" aria-modal="true" aria-label="Full view">
  <div class="full-head">
    <div class="num" id="fullNum"></div>
    <div class="meta"><b id="fullName"></b><p id="fullNote"></p></div>
    <div class="seg" role="group" aria-label="Width">
      <button data-fwidth="desktop" aria-pressed="true">Desktop</button>
      <button data-fwidth="mobile" aria-pressed="false">Mobile</button>
    </div>
    <button class="icon" id="closeFull" aria-label="Close full view">Close ✕</button>
  </div>
  <div class="full-body" id="fullBody"></div>
</div>

<!-- ===================== VARIANTS: START ===================== -->
<div class="variants-src">

<section class="round" data-round="1" data-title="Round 1 · 10 directions">
<!--
  Axes table (round 1)
  #  Name            Layout          Style      Type          Color          Density
  1  Clean SaaS      centered card   minimal    sans          mono + accent  airy
  2  Brutal block    split           brutalist  grotesk caps  flat saturated compact
-->

<!-- EXAMPLE — replace with real variants -->
<template class="variant" data-n="1" data-name="Clean SaaS" data-note="Centered white card, one blue accent, soft shadow." data-axes="centered · minimal · sans · mono+accent · airy">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f6f7fb; font-family: Inter, system-ui, sans-serif; color: #111827; }
  .wrap { padding: 64px 20px; display: grid; place-items: center; }
  .card { width: 100%; max-width: 360px; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(17,24,39,.08); text-align: center; }
  h2 { margin: 0 0 4px; font-size: 18px; } .price { font-size: 48px; font-weight: 800; margin: 12px 0; } .price small { font-size: 16px; color: #6b7280; font-weight: 400; }
  a { display: block; margin-top: 20px; background: #2563eb; color: #fff; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: 600; }
  a:hover, a:focus-visible { background: #1d4ed8; }
</style>
<div class="wrap"><div class="card"><h2>Pro</h2><div class="price">$29<small>/mo</small></div><p>Everything you need to ship faster.</p><a href="#">Start free trial</a></div></div>
</template>

<!-- EXAMPLE — replace with real variants -->
<template class="variant" data-n="2" data-name="Brutal block" data-note="Thick borders, hard shadow, split layout, loud yellow." data-axes="split · brutalist · grotesk caps · flat saturated · compact">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #fff8d6; font-family: "Space Grotesk", system-ui, sans-serif; color: #000; }
  .wrap { padding: 40px 20px; }
  .card { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; border: 3px solid #000; box-shadow: 8px 8px 0 #000; background: #fff; }
  .card > div { padding: 24px; } .card > div + div { border-left: 3px solid #000; background: #ffd400; }
  h2 { margin: 0; text-transform: uppercase; letter-spacing: .04em; } .price { font-size: 56px; font-weight: 700; line-height: 1; }
  a { display: inline-block; margin-top: 16px; background: #000; color: #fff; padding: 10px 16px; text-decoration: none; text-transform: uppercase; font-weight: 700; }
  a:hover, a:focus-visible { background: #2b59ff; }
  @media (max-width: 520px) { .card { grid-template-columns: 1fr; } .card > div + div { border-left: 0; border-top: 3px solid #000; } }
</style>
<div class="wrap"><div class="card"><div><h2>Pro</h2><p>Everything you need to ship faster.</p></div><div><div class="price">$29</div>per month<br><a href="#">Start free trial</a></div></div></div>
</template>

</section>

</div>
<!-- ===================== VARIANTS: END ===================== -->

<script>
(function () {
  var DESKTOP = 1280, MOBILE = 375;
  var state = { view: 'grid', width: 'desktop', round: null, fullWidth: 'desktop' };
  var cards = [];           // {el, stage, frame, width, h}
  var frames = {};          // id -> {frame, onHeight}
  var seq = 0;

  var store = {
    get: function (k) { try { return localStorage.getItem('pdd:' + document.title + ':' + k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem('pdd:' + document.title + ':' + k, v); } catch (e) {} }
  };

  var target = document.body.getAttribute('data-target') || 'Variants';
  document.getElementById('target').textContent = target;

  var rounds = [].slice.call(document.querySelectorAll('.variants-src .round')).map(function (sec, i) {
    return {
      id: sec.getAttribute('data-round') || String(i + 1),
      title: sec.getAttribute('data-title') || ('Round ' + (i + 1)),
      variants: [].slice.call(sec.querySelectorAll('template.variant')).map(function (t, j) {
        return {
          n: t.getAttribute('data-n') || String(j + 1),
          name: t.getAttribute('data-name') || '',
          note: t.getAttribute('data-note') || '',
          axes: t.getAttribute('data-axes') || '',
          html: t.innerHTML
        };
      })
    };
  });

  function srcdoc(html, id) {
    var reporter = '<script>(function(){var id=' + JSON.stringify(id) + ';function s(){var b=document.body;if(!b)return;var cs=getComputedStyle(b);' +
      'var h=Math.ceil(b.scrollHeight+parseFloat(cs.marginTop)+parseFloat(cs.marginBottom));parent.postMessage({pdd:id,h:h},"*")}' +
      'addEventListener("load",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);setTimeout(s,50);setTimeout(s,600);setTimeout(s,1500)})()<\/script>';
    return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base target="_blank">' +
      '<style>html,body{margin:0}</style></head><body>' + html + reporter + '</body></html>';
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d.pdd !== 'string' || !frames[d.pdd]) return;
    frames[d.pdd].onHeight(Math.max(60, Math.min(6000, d.h || 0)));
  });

  function makeFrame(html, onHeight) {
    var id = 'f' + (++seq);
    var f = document.createElement('iframe');
    f.setAttribute('title', 'variant preview');
    f.setAttribute('loading', 'lazy');
    f.srcdoc = srcdoc(html, id);
    frames[id] = { frame: f, onHeight: onHeight };
    return f;
  }

  function layoutCard(c) {
    var vw = c.width === 'mobile' ? MOBILE : DESKTOP;
    var avail = c.stage.clientWidth || 1;
    var scale = Math.min(1, avail / vw);
    c.frame.style.width = vw + 'px';
    c.frame.style.height = c.h + 'px';
    c.frame.style.transform = 'scale(' + scale + ')';
    c.frame.style.left = Math.max(0, (avail - vw * scale) / 2) + 'px';
    c.stage.style.height = Math.ceil(c.h * scale) + 'px';
    c.stage.classList.toggle('mobile', c.width === 'mobile');
    c.toggle.setAttribute('aria-pressed', String(c.width === 'mobile'));
    c.toggle.textContent = c.width === 'mobile' ? '📱 375' : '🖥 1280';
  }

  var ro = window.ResizeObserver ? new ResizeObserver(function () { cards.forEach(layoutCard); }) : null;
  window.addEventListener('resize', function () { cards.forEach(layoutCard); });

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function renderRound() {
    var board = document.getElementById('board');
    board.innerHTML = '';
    cards = []; frames = {};
    if (ro) ro.disconnect();
    var r = rounds.filter(function (x) { return x.id === state.round; })[0];
    if (!r || !r.variants.length) { board.appendChild(el('p', 'empty', 'No variants in this round yet.')); return; }
    r.variants.forEach(function (v) {
      var card = el('article', 'card');
      var head = el('div', 'card-head');
      head.appendChild(el('div', 'num', v.n));
      var meta = el('div', 'meta');
      meta.appendChild(el('b', null, v.name));
      if (v.note) meta.appendChild(el('p', null, v.note));
      if (v.axes) meta.appendChild(el('small', null, v.axes));
      head.appendChild(meta);
      var tools = el('div', 'tools');
      var toggle = el('button', 'icon'); toggle.title = 'Toggle desktop / mobile width';
      var expand = el('button', 'icon', '⤢'); expand.title = 'Open full view'; expand.setAttribute('aria-label', 'Open variant ' + v.n + ' full view');
      tools.appendChild(toggle); tools.appendChild(expand);
      head.appendChild(tools);
      card.appendChild(head);

      var stage = el('div', 'stage');
      stage.title = 'Click to open full view';
      var c = { el: card, stage: stage, width: state.width, h: 600, toggle: toggle };
      c.frame = makeFrame(v.html, function (h) { c.h = h; layoutCard(c); });
      stage.appendChild(c.frame);
      card.appendChild(stage);

      var picks = el('div', 'picks');
      picks.appendChild(el('span', null, 'Pick:'));
      [['whole', v.n], ['layout', 'layout from ' + v.n], ['colors', 'colors from ' + v.n], ['type', 'typography from ' + v.n], ['style', 'style from ' + v.n]]
        .forEach(function (p) {
          var b = el('button', null, p[0]);
          b.addEventListener('click', function () { addPick(p[0] === 'whole' ? v.n + ' as a whole' : p[1]); });
          picks.appendChild(b);
        });
      card.appendChild(picks);

      toggle.addEventListener('click', function () { c.width = c.width === 'mobile' ? 'desktop' : 'mobile'; layoutCard(c); });
      expand.addEventListener('click', function () { openFull(v, c.width); });
      stage.addEventListener('click', function () { openFull(v, c.width); });

      board.appendChild(card);
      cards.push(c);
      layoutCard(c);
      if (ro) ro.observe(stage);
    });
  }

  function renderTabs() {
    var tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    if (rounds.length < 2) return;
    rounds.forEach(function (r) {
      var b = el('button', null, r.title + ' (' + r.variants.length + ')');
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(r.id === state.round));
      b.addEventListener('click', function () { state.round = r.id; renderTabs(); renderRound(); window.scrollTo(0, 0); });
      tabs.appendChild(b);
    });
  }

  // view + width controls
  function setPressed(attr, val) {
    [].forEach.call(document.querySelectorAll('[' + attr + ']'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute(attr) === val)); });
  }
  [].forEach.call(document.querySelectorAll('[data-view]'), function (b) {
    b.addEventListener('click', function () {
      state.view = b.getAttribute('data-view'); store.set('view', state.view);
      setPressed('data-view', state.view);
      document.getElementById('board').classList.toggle('list', state.view === 'list');
      requestAnimationFrame(function () { cards.forEach(layoutCard); });
    });
  });
  [].forEach.call(document.querySelectorAll('[data-width]'), function (b) {
    b.addEventListener('click', function () {
      state.width = b.getAttribute('data-width');
      setPressed('data-width', state.width);
      cards.forEach(function (c) { c.width = state.width; layoutCard(c); });
    });
  });

  // full view
  var full = document.getElementById('full'), fullBody = document.getElementById('fullBody'), fullCurrent = null;
  function openFull(v, width) {
    fullCurrent = v; state.fullWidth = width;
    document.getElementById('fullNum').textContent = v.n;
    document.getElementById('fullName').textContent = v.name;
    document.getElementById('fullNote').textContent = v.note;
    setPressed('data-fwidth', width);
    fullBody.classList.toggle('mobile', width === 'mobile');
    fullBody.innerHTML = '';
    var f = makeFrame(v.html, function (h) { f.style.height = h + 'px'; });
    f.removeAttribute('loading');
    f.style.height = '80vh';
    fullBody.appendChild(f);
    full.classList.add('on');
    document.body.style.overflow = 'hidden';
    document.getElementById('closeFull').focus();
  }
  function closeFull() { full.classList.remove('on'); fullBody.innerHTML = ''; document.body.style.overflow = ''; }
  document.getElementById('closeFull').addEventListener('click', closeFull);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && full.classList.contains('on')) closeFull(); });
  [].forEach.call(document.querySelectorAll('[data-fwidth]'), function (b) {
    b.addEventListener('click', function () {
      var w = b.getAttribute('data-fwidth');
      setPressed('data-fwidth', w);
      fullBody.classList.toggle('mobile', w === 'mobile');
    });
  });

  // pick bar
  var pickbar = document.getElementById('pickbar'), pickText = document.getElementById('pickText');
  function syncPickbar() { pickbar.classList.toggle('on', pickText.value.trim() !== ''); store.set('picks', pickText.value); }
  function addPick(s) { pickText.value = pickText.value.trim() ? pickText.value.replace(/[,\s]+$/, '') + ', ' + s : s; syncPickbar(); }
  pickText.addEventListener('input', syncPickbar);
  document.getElementById('clearPicks').addEventListener('click', function () { pickText.value = ''; syncPickbar(); });
  document.getElementById('copyPicks').addEventListener('click', function () {
    var btn = this, txt = pickText.value;
    function done() { btn.textContent = 'Copied ✓'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
    function fallback() { pickText.select(); try { document.execCommand('copy'); done(); } catch (e) {} }
  });

  // init
  state.round = rounds.length ? rounds[rounds.length - 1].id : null;
  var savedView = store.get('view');
  if (savedView === 'list' || savedView === 'grid') {
    state.view = savedView; setPressed('data-view', savedView);
    document.getElementById('board').classList.toggle('list', savedView === 'list');
  }
  pickText.value = store.get('picks') || '';
  syncPickbar();
  renderTabs();
  renderRound();
})();
</script>
</body>
</html>
